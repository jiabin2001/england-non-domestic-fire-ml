[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "england-non-domestic-fire-ml"
version = "0.1.0"
description = "Temporally validated prediction of fire spread in England's Other Building Fires Dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost==1.2.10",
  "joblib==1.5.3",
  "matplotlib==3.11.1",
  "numpy==2.5.1",
  "odfpy==1.4.1",
  "pandas==3.0.5",
  "pyarrow==25.0.0",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "xgboost==3.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
