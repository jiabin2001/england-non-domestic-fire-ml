name: Synthetic unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests without research data or model training
        run: python -m pytest -q -m "not artifact and not integration"
      - name: Check historical research artifacts remain unchanged
        run: git diff --exit-code -- outputs data/raw/source_metadata.json
